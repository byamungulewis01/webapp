<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebApp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>CODERWANDA Web App</h1>
    <p id="info">Loading...</p>
    <a class="btn" href="register.html">Register</a>
  </div>
  <script>
    fetch('/api/info')
      .then(r => r.json())
      .then(d => { document.getElementById('info').textContent = d.message; });
  </script>
</body>
</html>
